<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SRTP receiver</title>
<style>body{font-family:sans-serif;background:#111;color:#eee}#log{font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<video id="video" autoplay muted playsinline controls style="width:640px;background:#000"></video>
<div id="status">disconnected</div>
<div id="log"></div>
<script>
const wsAddr = `ws://${location.hostname || "localhost"}:8080`;
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
let frames = 0;

function log(msg) {
  logEl.textContent += msg + "\n";
  console.log(msg);
}

// Frames actually decoded and presented, reported via rAF-aligned callback.
video.requestVideoFrameCallback(function cb() {
  frames++;
  video.requestVideoFrameCallback(cb);
});

const ws = new WebSocket(wsAddr);
const pc = new RTCPeerConnection();
pc.addTransceiver("video", {direction: "recvonly"});

ws.onopen = async () => {
  statusEl.textContent = "connected to " + wsAddr + ", sending offer";
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({type: "offer", sdp: offer.sdp}));
};

ws.onmessage = async (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "answer") {
    await pc.setRemoteDescription({type: "answer", sdp: msg.sdp});
    log("answer set");
  } else if (msg.type === "candidate") {
    await pc.addIceCandidate({candidate: msg.candidate, sdpMid: msg.sdpMid});
  }
};

ws.onclose = () => statusEl.textContent = "signaling closed";
ws.onerror = () => statusEl.textContent = "signaling error";

pc.onicecandidate = (ev) => {
  if (ev.candidate)
    ws.send(JSON.stringify({type: "candidate", candidate: ev.candidate.candidate,
                            sdpMid: ev.candidate.sdpMid}));
};

pc.ontrack = (ev) => {
  log("track received: " + ev.track.kind + " " + ev.track.id);
  video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
};

pc.onconnectionstatechange = () => {
  statusEl.textContent = "pc state: " + pc.connectionState;
  log("pc state: " + pc.connectionState);
};

setInterval(async () => {
  const stats = await pc.getStats();
  stats.forEach(s => {
    if (s.type === "inbound-rtp")
      log(`inbound ssrc=${s.ssrc} kind=${s.kind} codec=${s.codecId} pkts=${s.packetsReceived} lost=${s.packetsLost} framesRecv=${s.framesReceived} framesDec=${s.framesDecoded} track=${s.trackIdentifier}`);
  });
  const t = video.srcObject && video.srcObject.getVideoTracks()[0];
  log(`frames=${frames} size=${video.videoWidth}x${video.videoHeight} t=${video.currentTime.toFixed(1)}s readyState=${t && t.readyState} muted=${t && t.muted}`);
}, 2000);
</script>
</body>
</html>
